# Builds every clockface on each push and pull request (no secrets, nothing uploaded).
#
# A release is a tag: push a tag that starts with v on a commit of main (git tag v1 && git push origin v1, or
# "Create release" on GitHub) and the builds of that commit are published to the gh-pages branch, which GitHub
# Pages serves. That is where the clocks download their firmware (https://vandalon.github.io/clockwizer/cw-cf-0xNN.bin
# and .md5) and where the web flasher lives. The firmware version is made by the workflow: the build date and a
# number that counts up during the day. Publishing to your own update server stays with firmware/update-fw.sh.
name: Build firmware

on:
  push:
  pull_request:

permissions:
  contents: read

# Runs on main go one after the other, so each one sees the version the one before it published
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The firmware version is the build date and a number that counts up during the day: 2026.10.11.1, 2026.10.11.2...
  # It continues from what is published on the gh-pages branch.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(TZ=Europe/Amsterdam date +%Y.%m.%d)
          published=$(gh api "repos/$GITHUB_REPOSITORY/contents/manifest-cw-cf-0x0C.json?ref=gh-pages" -q .content 2>/dev/null | base64 -d | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' 2>/dev/null || true)
          number=1
          if [[ "$published" == "$today".* ]]; then number=$(( ${published##*.} + 1 )); fi
          echo "Published: ${published:-none}, this build: $today.$number"
          echo "version=$today.$number" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # a broken face should not hide the others
      matrix:
        env:
          - cw-cf-0x01  # Mario
          - cw-cf-0x02  # Time in Words
          - cw-cf-0x03  # World Map
          - cw-cf-0x04  # Castlevania
          - cw-cf-0x05  # Pacman
          - cw-cf-0x06  # Pokemon
          - cw-cf-0x08  # Tetris
          - cw-cf-0x09  # Luigi
          - cw-cf-0x0B  # Football
          - cw-cf-0x0C  # Formula 1
    steps:
      - uses: actions/checkout@v7

      # The first build unpacks about 3.5 GB of framework next to a temporary copy of it
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install "platformio>=6.2"

      - name: Cache PlatformIO (framework, toolchain, libraries)
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: platformio-${{ runner.os }}-

      # The version in platformio.ini is for builds on your own machine; GitHub's builds get the date and number
      - name: Set the firmware version
        run: sed -i 's/CW_FW_VERSION="\\"[^\\]*\\""/CW_FW_VERSION="\\"${{ needs.version.outputs.version }}\\""/' firmware/platformio.ini

      - name: Build ${{ matrix.env }}
        working-directory: firmware
        # The first build on a new platform folder sometimes fails once: run it again
        run: pio run -e ${{ matrix.env }} || pio run -e ${{ matrix.env }}

      - name: Collect the files of the web flasher
        run: cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin firmware/.pio/build/${{ matrix.env }}/

      - name: Keep the firmware
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.env }}
          path: |
            firmware/.pio/build/${{ matrix.env }}/firmware.bin
            firmware/.pio/build/${{ matrix.env }}/bootloader.bin
            firmware/.pio/build/${{ matrix.env }}/partitions.bin
            firmware/.pio/build/${{ matrix.env }}/boot_app0.bin
          retention-days: 14

  # Only a tag starting with v, on a commit of main, and only when every face built: never a pull request or a branch
  publish:
    needs: [version, build]
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && github.repository == 'vandalon/clockwizer'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # the push to gh-pages
      pages: write     # ask for a Pages build afterwards
    concurrency:
      group: publish-pages
      cancel-in-progress: false  # two pushes in a row publish one after the other
    steps:
      - uses: actions/checkout@v7
        with:
          path: source
          persist-credentials: false
          fetch-depth: 0  # all of main's history, to check the tag is on it

      - name: The tag must be on main
        run: |
          if ! git -C source merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "This tag is not on main, nothing is published"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          path: builds
          pattern: cw-cf-*

      - name: Publish to the gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone -q --depth 1 -b gh-pages "https://github.com/$GITHUB_REPOSITORY.git" pages
          python3 source/firmware/tools/make_pages.py builds pages ${{ needs.version.outputs.version }}
          cd pages
          git add -A
          if git diff --cached --quiet; then
            echo "Pages already has these builds"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A single commit each time: Pages only needs the latest files, and the history would only grow
          git checkout -q --orphan publish
          git commit -q -m "Firmware $(date -u '+%Y-%m-%d %H:%M') ($(echo "$GITHUB_SHA" | cut -c1-7))"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push -q --force origin publish:gh-pages
          echo "Published to the gh-pages branch"
          # A push with the workflow's token does not always start the Pages build by itself
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent || echo "Pages build not requested (it may start by itself)"
