; PlatformIO Project Configuration File
;
; One environment per clockface. Build all of them with `pio run`,
; or a single one with e.g. `pio run -e cw-cf-0x08`.
; Firmware ends up in .pio/build/<env>/firmware.bin
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = cw-cf-0x01, cw-cf-0x02, cw-cf-0x03, cw-cf-0x04, cw-cf-0x05, cw-cf-0x06, cw-cf-0x08, cw-cf-0x09, cw-cf-0x0B, cw-cf-0x0C
name = Clockwizer

[env:native]
platform = native
test_framework = unity

; Shared settings for all clockfaces. Everything is pinned so a fresh
; checkout builds exactly the same firmware.
[clockwise]
; Experiment: Arduino 3.x (pioarduino, pinned) with the TLS buffers rebuilt smaller: 16 KB in, 4 KB out,
; and the server certificate not kept after the handshake (nothing checks it: setInsecure everywhere)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
custom_sdkconfig =
	CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN=y
	CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
	CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096
	CONFIG_MBEDTLS_SSL_KEEP_PEER_CERTIFICATE=n
	CONFIG_MBEDTLS_SSL_PROTO_DTLS=n
	CONFIG_MBEDTLS_DYNAMIC_BUFFER=y
	CONFIG_MBEDTLS_DYNAMIC_FREE_PEER_CERT=y
	CONFIG_MBEDTLS_DYNAMIC_FREE_CONFIG_DATA=y
	CONFIG_BT_ENABLED=n
	CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM=5
	CONFIG_LWIP_TCPIP_TASK_STACK_SIZE=3072
board = esp32dev
; Bigger OTA slots (1.9 MB instead of 1.25 MB). NVS stays at the same offset so settings survive.
; Needs a one-time USB flash to take effect: the partition table cannot be changed over OTA.
board_build.partitions = min_spiffs.csv
framework = arduino
test_ignore = test_native
monitor_speed = 115200
lib_deps =
	https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git#f17fb7fe9d487e9643f919eb5aeedea8d9d1f8d7
	adafruit/Adafruit GFX Library@1.12.6
	adafruit/Adafruit BusIO@1.17.4
	jchristensen/movingAvg@2.3.2
	https://github.com/tzapu/WiFiManager#4131fe617d01d746677e8b909379597162c2ca58
	https://github.com/JAndrassy/TelnetStream#d63a8cebfcf06b3d12a93f599a9dedfbd36399e1
	ricmoo/QRCode@0.0.1
extra_scripts =
	pre:tools/gzip_page.py
	pre:tools/gen_faces.py
build_src_filter = +<*> -<.git/> -<.svn/> -<example/> -<examples/> -<test/> -<tests/>
build_flags =
	-D CW_FW_VERSION="\"2026.10.08.1\""

[env:cw-cf-0x01]
extends = clockwise
lib_deps = ${clockwise.lib_deps}
	symlink://clockfaces/cw-cf-0x01
build_flags = ${clockwise.build_flags}
	-D CW_FW_NAME="\"Mario\""
	-D CW_FW_ID="\"0x01\""

[env:cw-cf-0x02]
extends = clockwise
lib_deps = ${clockwise.lib_deps}
	symlink://clockfaces/cw-cf-0x02
build_flags = ${clockwise.build_flags}
	-D CW_FW_NAME="\"Time in Words\""
	-D CW_FW_ID="\"0x02\""

[env:cw-cf-0x03]
extends = clockwise
lib_deps = ${clockwise.lib_deps}
	symlink://clockfaces/cw-cf-0x03
build_flags = ${clockwise.build_flags}
	-D CW_FW_NAME="\"World Map\""
	-D CW_FW_ID="\"0x03\""

[env:cw-cf-0x04]
extends = clockwise
lib_deps = ${clockwise.lib_deps}
	symlink://clockfaces/cw-cf-0x04
build_flags = ${clockwise.build_flags}
	-D CW_FW_NAME="\"Castlevania\""
	-D CW_FW_ID="\"0x04\""

[env:cw-cf-0x05]
extends = clockwise
lib_deps = ${clockwise.lib_deps}
	symlink://clockfaces/cw-cf-0x05
build_flags = ${clockwise.build_flags}
	-D CW_FW_NAME="\"Pacman\""
	-D CW_FW_ID="\"0x05\""

[env:cw-cf-0x06]
extends = clockwise
lib_deps = ${clockwise.lib_deps}
	symlink://clockfaces/cw-cf-0x06
build_flags = ${clockwise.build_flags}
	-D CW_FW_NAME="\"Pokemon\""
	-D CW_FW_ID="\"0x06\""

[env:cw-cf-0x08]
extends = clockwise
lib_deps = ${clockwise.lib_deps}
	symlink://clockfaces/cw-cf-0x08
build_flags = ${clockwise.build_flags}
	-D CW_FOOTBALL_RACE
	-D CW_FW_NAME="\"Tetris\""
	-D CW_FW_ID="\"0x08\""
	-D DOUBLE_BUFFER_ON
	-D CLOCKFACE_UPDATE_MS=10
	-D CW_FOOTBALL_CATALOG
	-D CW_FOOTBALL_TICKER

[env:cw-cf-0x0B]
extends = clockwise
lib_deps = ${clockwise.lib_deps}
	symlink://clockfaces/cw-cf-0x0B
build_flags = ${clockwise.build_flags}
	-D CW_FOOTBALL_ONLY
	-D CW_FW_NAME="\"Football\""
	-D CW_FW_ID="\"0x0B\""
	-D CW_FOOTBALL_SIM
	-D CW_FOOTBALL_CATALOG
	-D DOUBLE_BUFFER_ON
	-D CLOCKFACE_UPDATE_MS=50

; Formula 1: live sessions, the clock between them, the championship and the next race
[env:cw-cf-0x0C]
extends = clockwise
lib_deps = ${clockwise.lib_deps}
	symlink://clockfaces/cw-cf-0x0C
build_flags = ${clockwise.build_flags}
	-D CW_F1
	-D CW_FW_NAME="\"Formula 1\""
	-D CW_FW_ID="\"0x0C\""
	-D CW_FOOTBALL_SIM
	-D DOUBLE_BUFFER_ON
	-D CW_PIXEL_DEPTH_BITS=7
	-D PIXEL_COLOR_DEPTH_BITS=CW_PIXEL_DEPTH_BITS
	-D CLOCKFACE_UPDATE_MS=50

; Same clockface as Mario, in Luigi colours
[env:cw-cf-0x09]
extends = clockwise
lib_deps = ${clockwise.lib_deps}
	symlink://clockfaces/cw-cf-0x01
build_flags = ${clockwise.build_flags}
	-D CW_FW_NAME="\"Luigi\""
	-D CW_FW_ID="\"0x09\""
	-D CW_LUIGI
